name: Release

# Runs on every push to main, except the version-bump commit this same
# workflow creates (marked [skip release] to avoid retriggering itself —
# see specs/05-release-versioning-spec.md). workflow_dispatch lets a
# release be re-run manually (e.g. right after adding a store's secrets
# for the first time) without needing a throwaway commit just to trigger it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  determine-version:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        env:
          # Passed via env, never interpolated directly into the script
          # below: a commit message is attacker-influenceable text (anyone
          # who can push a commit controls it), and embedding
          # ${{ github.event.head_commit.message }} straight into a `run:`
          # block is a classic GitHub Actions script-injection hole — a
          # message containing backticks or `$(...)` would otherwise be
          # re-parsed as shell syntax. $COMMIT_MESSAGE below is just a
          # variable expansion, never re-parsed by the shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          current="$(cat VERSION)"
          IFS='.' read -r major minor patch <<< "$current"

          # Explicit bump signal in the commit message, per
          # specs/05-release-versioning-spec.md — deliberately not parsing
          # full Conventional Commits yet, to avoid unpredictable jumps
          # while the convention is still being adopted.
          if echo "$COMMIT_MESSAGE" | grep -qi '\[major\]'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$COMMIT_MESSAGE" | grep -qi '\[minor\]'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="${major}.${minor}.${patch}"
          echo "$new_version" > VERSION
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"

      # Keeps every file specs/05-release-versioning-spec.md names as a
      # "single source of truth" location in sync — manifest.json and
      # __version__.py were already handled here; the README badge was
      # missing (a real gap: the badge sat stuck on 0.1.0 through the
      # v0.1.1 release), so it's included now.
      - name: Sync version into manifest.json, __version__.py, and README badge
        run: |
          set -euo pipefail
          new_version="${{ steps.bump.outputs.new_version }}"
          python3 - "$new_version" <<'PY'
          import json
          import re
          import sys

          new_version = sys.argv[1]

          manifest_path = "extension/manifest.json"
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = new_version
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          version_py_path = "backend/ytdlx_backend/__version__.py"
          with open(version_py_path, encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r'__version__ = ".*"', f'__version__ = "{new_version}"', content)
          with open(version_py_path, "w", encoding="utf-8") as f:
              f.write(content)

          readme_path = "README.md"
          with open(readme_path, encoding="utf-8") as f:
              readme = f.read()
          readme = re.sub(
              r"badge/version-[^-]+-blue",
              f"badge/version-{new_version}-blue",
              readme,
          )
          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION extension/manifest.json backend/ytdlx_backend/__version__.py README.md
          git commit -m "chore(release): v${{ steps.bump.outputs.new_version }} [skip release]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

  build-extension:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build Chrome/Firefox packages
        run: |
          npx --yes web-ext@8 build --source-dir=extension --artifacts-dir=build --overwrite-dest
          version="${{ needs.determine-version.outputs.new_version }}"
          mv build/*.zip "ytdlx-chrome-v${version}.zip"
          cp "ytdlx-chrome-v${version}.zip" "ytdlx-firefox-v${version}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: ytdlx-*.zip

  build-windows-exe:
    needs: determine-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-version.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pyinstaller
      # --distpath points at ytdlx_backend/ (next to main.py) per the
      # project requirement that the built exe lives alongside its .py —
      # see the comment at the top of pyinstaller.spec for why this can't
      # be pinned inside the spec file itself.
      - run: pyinstaller backend/pyinstaller.spec --distpath backend/ytdlx_backend --workpath backend/build
      - name: Rename artifact
        shell: bash
        run: |
          version="${{ needs.determine-version.outputs.new_version }}"
          mv backend/ytdlx_backend/ytdlx_backend.exe "ytdlx-backend-v${version}-windows.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: ytdlx-backend-*-windows.exe

  # The three store-publish jobs below are best-effort and self-skipping:
  # each first checks whether its own secrets are configured yet and, if
  # not, skips its remaining steps without failing — pushing to main must
  # keep producing a working GitHub Release (extension zips + exe) exactly
  # as before, regardless of whether any store account has been set up.
  # See specs/06-store-publishing-spec.md and the store-publish skill for
  # the one-time manual account setup each of these depends on.

  publish-firefox-amo:
    needs: [determine-version, build-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-version.outputs.tag }}
      - name: Check for AMO credentials
        id: check
        run: |
          if [ -n "${{ secrets.AMO_JWT_ISSUER }}" ] && [ -n "${{ secrets.AMO_JWT_SECRET }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMO_JWT_ISSUER/AMO_JWT_SECRET not set - skipping Firefox signing. See the store-publish skill."
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      # channel=listed submits for Mozilla's public-listing review, so the
      # add-on becomes searchable on addons.mozilla.org with its own page
      # (specs/06-store-publishing-spec.md) -- not just a signed .xpi for
      # direct/self distribution. The first submission on this channel is
      # the one that creates the public listing; Mozilla's review can take
      # anywhere from minutes to a few days, especially given the
      # nativeMessaging permission this extension requests. web-ext sign
      # waits for the review outcome before this step completes, so a slow
      # review shows up as this step simply taking longer, not as a stuck
      # job.
      # AMO rejects a `listed` submission with no license declared ("This
      # field, or custom_license, is required for listed versions.") --
      # found the hard way on the first real run. --amo-metadata supplies
      # the license/category/summary AMO's API requires but the extension
      # package itself has no place for; .github/amo-metadata.json lives
      # outside extension/ so it's never bundled into the shipped zip/xpi.
      - if: steps.check.outputs.configured == 'true'
        name: Sign with web-ext (Mozilla AMO)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          npx --yes web-ext@8 sign --source-dir=extension --artifacts-dir=signed --channel=listed --amo-metadata=.github/amo-metadata.json
          version="${{ needs.determine-version.outputs.new_version }}"
          mv signed/*.xpi "ytdlx-firefox-v${version}.xpi"
      - if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: firefox-signed-xpi
          path: ytdlx-firefox-*.xpi

  publish-chrome-webstore:
    needs: [determine-version, build-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Check for Chrome Web Store credentials
        id: check
        run: |
          if [ -n "${{ secrets.CHROME_EXTENSION_ID }}" ] && [ -n "${{ secrets.CHROME_CLIENT_ID }}" ] \
             && [ -n "${{ secrets.CHROME_CLIENT_SECRET }}" ] && [ -n "${{ secrets.CHROME_REFRESH_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome Web Store secrets not set - skipping. See the store-publish skill."
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: extension-packages
          path: chrome-package
      # Calls the official Chrome Web Store API directly (no third-party
      # GitHub Action) — a prior attempt used a community action whose repo
      # no longer resolves, which broke the whole release pipeline because
      # GitHub validates every `uses:` in a job during "Set up job" before
      # any step-level `if:` is evaluated. Plain curl against Google's
      # documented, long-stable endpoints avoids that failure mode
      # entirely. Re-verify against
      # https://developer.chrome.com/docs/webstore/using-api if this
      # ever needs updating.
      - if: steps.check.outputs.configured == 'true'
        name: Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          zip_path="chrome-package/ytdlx-chrome-v${{ needs.determine-version.outputs.new_version }}.zip"

          access_token="$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_CLIENT_ID}" \
            -d "client_secret=${CHROME_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")"

          curl -sf -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}?uploadType=media" \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            -T "$zip_path"

          curl -sf -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}/publish" \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0"

  publish-edge-addons:
    needs: [determine-version, build-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Check for Edge Add-ons credentials
        id: check
        run: |
          if [ -n "${{ secrets.EDGE_PRODUCT_ID }}" ] && [ -n "${{ secrets.EDGE_CLIENT_ID }}" ] \
             && [ -n "${{ secrets.EDGE_CLIENT_SECRET }}" ] && [ -n "${{ secrets.EDGE_ACCESS_TOKEN_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Edge Add-ons secrets not set - skipping. See the store-publish skill."
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: extension-packages
          path: edge-package
      - if: steps.check.outputs.configured == 'true'
        # Community-maintained action - verify current inputs before the
        # first real run (specs/06-store-publishing-spec.md).
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: edge-package/ytdlx-chrome-v${{ needs.determine-version.outputs.new_version }}.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          client-secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          access-token-url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}

  publish-release:
    needs:
      - determine-version
      - build-extension
      - build-windows-exe
      - publish-firefox-amo
      - publish-chrome-webstore
      - publish-edge-addons
    # if: always() is load-bearing here: a genuine failure in any of the
    # three best-effort store-publish jobs (bad credentials, a store API
    # outage, an invalid action reference — this exact class of bug already
    # broke one release) must never block the actual GitHub Release, which
    # only depends on build-extension/build-windows-exe having succeeded.
    # Without this, `needs:` defaults to requiring every listed job to
    # succeed, turning "best-effort" store publishing into a hard
    # dependency it was never meant to be.
    if: always() && needs.build-extension.result == 'success' && needs.build-windows-exe.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: ${{ needs.determine-version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
