name: Release

# Runs on every push to main, except the version-bump commit this same
# workflow creates (marked [skip release] to avoid retriggering itself —
# see specs/05-release-versioning-spec.md).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  determine-version:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        env:
          # Passed via env, never interpolated directly into the script
          # below: a commit message is attacker-influenceable text (anyone
          # who can push a commit controls it), and embedding
          # ${{ github.event.head_commit.message }} straight into a `run:`
          # block is a classic GitHub Actions script-injection hole — a
          # message containing backticks or `$(...)` would otherwise be
          # re-parsed as shell syntax. $COMMIT_MESSAGE below is just a
          # variable expansion, never re-parsed by the shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          current="$(cat VERSION)"
          IFS='.' read -r major minor patch <<< "$current"

          # Explicit bump signal in the commit message, per
          # specs/05-release-versioning-spec.md — deliberately not parsing
          # full Conventional Commits yet, to avoid unpredictable jumps
          # while the convention is still being adopted.
          if echo "$COMMIT_MESSAGE" | grep -qi '\[major\]'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$COMMIT_MESSAGE" | grep -qi '\[minor\]'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="${major}.${minor}.${patch}"
          echo "$new_version" > VERSION
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"

      # Keeps every file specs/05-release-versioning-spec.md names as a
      # "single source of truth" location in sync — manifest.json and
      # __version__.py were already handled here; the README badge was
      # missing (a real gap: the badge sat stuck on 0.1.0 through the
      # v0.1.1 release), so it's included now.
      - name: Sync version into manifest.json, __version__.py, and README badge
        run: |
          set -euo pipefail
          new_version="${{ steps.bump.outputs.new_version }}"
          python3 - "$new_version" <<'PY'
          import json
          import re
          import sys

          new_version = sys.argv[1]

          manifest_path = "extension/manifest.json"
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = new_version
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          version_py_path = "backend/ytdlx_backend/__version__.py"
          with open(version_py_path, encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r'__version__ = ".*"', f'__version__ = "{new_version}"', content)
          with open(version_py_path, "w", encoding="utf-8") as f:
              f.write(content)

          readme_path = "README.md"
          with open(readme_path, encoding="utf-8") as f:
              readme = f.read()
          readme = re.sub(
              r"badge/version-[^-]+-blue",
              f"badge/version-{new_version}-blue",
              readme,
          )
          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION extension/manifest.json backend/ytdlx_backend/__version__.py README.md
          git commit -m "chore(release): v${{ steps.bump.outputs.new_version }} [skip release]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

  build-extension:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build Chrome/Firefox packages
        run: |
          npx --yes web-ext@8 build --source-dir=extension --artifacts-dir=build --overwrite-dest
          version="${{ needs.determine-version.outputs.new_version }}"
          mv build/*.zip "ytdlx-chrome-v${version}.zip"
          cp "ytdlx-chrome-v${version}.zip" "ytdlx-firefox-v${version}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: ytdlx-*.zip

  build-windows-exe:
    needs: determine-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-version.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pyinstaller
      # --distpath points at ytdlx_backend/ (next to main.py) per the
      # project requirement that the built exe lives alongside its .py —
      # see the comment at the top of pyinstaller.spec for why this can't
      # be pinned inside the spec file itself.
      - run: pyinstaller backend/pyinstaller.spec --distpath backend/ytdlx_backend --workpath backend/build
      - name: Rename artifact
        shell: bash
        run: |
          version="${{ needs.determine-version.outputs.new_version }}"
          mv backend/ytdlx_backend/ytdlx_backend.exe "ytdlx-backend-v${version}-windows.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: ytdlx-backend-*-windows.exe

  publish-release:
    needs: [determine-version, build-extension, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: ${{ needs.determine-version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
