[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# main.py deliberately checks for the internal yt-dlp worker sentinel
# (see ytdlp_runner.maybe_run_as_yt_dlp_worker) before importing tkinter/
# pystray, so a frozen re-exec running yt-dlp never pays for GUI imports
# it will never use — that ordering requires imports below the check.
"ytdlx_backend/main.py" = ["E402"]
